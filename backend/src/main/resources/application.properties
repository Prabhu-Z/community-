server.port=${PORT:8080}
spring.application.name=scts-backend

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sctsdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}

# JPA / Hibernate Naming & DDL Properties
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
scts.app.jwtSecret=${JWT_SECRET:your_jwt_secret_key_change_in_production_environment_32chars}
scts.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

# Google OAuth Configuration
google.client.id=${GOOGLE_CLIENT_ID:your_google_client_id_placeholder.apps.googleusercontent.com}
google.client.secret=${GOOGLE_CLIENT_SECRET:your_google_client_secret_placeholder}

# File Upload Configuration
file.upload-dir=uploads/certificates
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
